下","text":"人不在這裡的時候，日子過得最快。"},{"id":"A06","theme":"活在當下","text":"今天只過今天的份。"},{"id":"A07","theme":"活在當下","text":"腳踩在哪裡，心就放在哪裡。"},{"id":"A08","theme":"活在當下","text":"先把眼前這一步走穩，路自己會長出來。"},{"id":"A09","theme":"活在當下","text":"就在這一秒，其實沒有任何事正在出錯。"},{"id":"A10","theme":"活在當下","text":"一次只做一件事，是對自己最大的溫柔。"},{"id":"A11","theme":"活在當下","text":"抬頭看一眼天空，提醒自己：世界比煩惱大得多。"},{"id":"A12","theme":"活在當下","text":"好好吃飯，好好睡覺，就已經是在好好生活。"},{"id":"A13","theme":"活在當下","text":"現在能做的，只有現在這件事。"},{"id":"A14","theme":"活在當下","text":"把手機放下三分鐘，世界不會走遠，你卻回來了。"},{"id":"A15","theme":"活在當下","text":"不用等一切就緒才開始享受，現在就可以。"},{"id":"A16","theme":"活在當下","text":"聽見鳥叫的那一秒，你就已經回到當下了。"},{"id":"A17","theme":"活在當下","text":"專心把這一餐吃完，比想通十件事更有用。"},{"id":"A18","theme":"活在當下","text":"此時此地，就是你唯一需要在的地方。"},{"id":"A19","theme":"活在當下","text":"念頭跑遠了沒關係，發現了，就已經回來了。"},{"id":"A20","theme":"活在當下","text":"日子不是用來趕完的，是用來過的。"},{"id":"B01","theme":"放下與接納","text":"放下不是認輸，是把手空出來，接住接下來的好事。"},{"id":"B02","theme":"放下與接納","text":"有些事想不通，就先不想，時間到了自己會通。"},{"id":"B03","theme":"放下與接納","text":"你不必回應每一個念頭，讓它像雲一樣飄過去就好。"},{"id":"B04","theme":"放下與接納","text":"情緒是客人，會來，也會走。"},{"id":"B05","theme":"放下與接納","text":"接受今天的自己只有六十分，也是一種能力。"},{"id":"B06","theme":"放下與接納","text":"不是每件事都需要答案，有些只需要時間。"},{"id":"B07","theme":"放下與接納","text":"控制不了的事，就交還給它自己。"},{"id":"B08","theme":"放下與接納","text":"把「為什麼是我」換成「那我現在可以做什麼」。"},{"id":"B09","theme":"放下與接納","text":"過不去的時候，就先過這五分鐘。"},{"id":"B10","theme":"放下與接納","text":"允許事情不如預期，日子反而順了。"},{"id":"B11","theme":"放下與接納","text":"別人怎麼想，是他的功課，不是你的行李。"},{"id":"B12","theme":"放下與接納","text":"不必贏過每一場爭論，安靜也是一種答案。"},{"id":"B13","theme":"放下與接納","text":"過去的事已經盡力了，就讓它留在過去。"},{"id":"B14","theme":"放下與接納","text":"你可以難過，但不必一直住在難過裡。"},{"id":"B15","theme":"放下與接納","text":"有些人只是陪你走一段，謝謝他，然後繼續走。"},{"id":"B16","theme":"放下與接納","text":"不完美不是缺陷，是你正在活著的證明。"},{"id":"B17","theme":"放下與接納","text":"把期待放低一點，驚喜就多一點。"},{"id":"B18","theme":"放下與接納","text":"原諒不是為了對方，是讓自己不用再背著。"},{"id":"B19","theme":"放下與接納","text":"事情已經發生了，接下來只剩「怎麼過」這一題。"},{"id":"B20","theme":"放下與接納","text":"今天解決不了的，就先放著，它不會跑。"},{"id":"C01","theme":"慢下來","text":"慢一點沒關係，你不是在趕路，你是在生活。"},{"id":"C02","theme":"慢下來","text":"累了就停，停下來不是落後，是在充電。"},{"id":"C03","theme":"慢下來","text":"深呼吸三次，世界不會因此少轉一圈。"},{"id":"C04","theme":"慢下來","text":"急的時候，先把手上的東西放下，再把肩膀放下。"},{"id":"C05","theme":"慢下來","text":"沒有人規定今天一定要有進度。"},{"id":"C06","theme":"慢下來","text":"走慢一點，才看得見路邊的花。"},{"id":"C07","theme":"慢下來","text":"給自己十分鐘什麼都不做，這不叫浪費，這叫保養。"},{"id":"C08","theme":"慢下來","text":"事情很多的時候，更要一件一件來。"},{"id":"C09","theme":"慢下來","text":"安靜不是空白，是讓心有地方坐下來。"},{"id":"C10","theme":"慢下來","text":"你不必馬上好起來。"},{"id":"C11","theme":"慢下來","text":"休息不是獎勵，是必需品。"},{"id":"C12","theme":"慢下來","text":"喝水的時候，就只喝水。"},{"id":"C13","theme":"慢下來","text":"行事曆上，也要有一格寫著「空白」。"},{"id":"C14","theme":"慢下來","text":"不是所有訊息都要立刻回。"},{"id":"C15","theme":"慢下來","text":"慢慢來，比較不會錯過自己。"},{"id":"C16","theme":"慢下來","text":"把呼吸放慢，事情看起來就沒那麼急了。"},{"id":"C17","theme":"慢下來","text":"先停下來，才知道自己其實在往哪裡走。"},{"id":"C18","theme":"慢下來","text":"今天少做一件事，換多一點從容。"},{"id":"C19","theme":"慢下來","text":"等紅燈的三十秒，是老天送你的休息時間。"},{"id":"C20","theme":"慢下來","text":"忙的時候，更需要坐下來五分鐘。"},{"id":"D01","theme":"善待自己","text":"「你已經很努力了」，這句話請先對自己說。"},{"id":"D02","theme":"善待自己","text":"對自己說話的口氣，要像對待最好的朋友。"},{"id":"D03","theme":"善待自己","text":"今天沒有崩潰，就值得被稱讚。"},{"id":"D04","theme":"善待自己","text":"你不需要先變得更好，才值得被善待。"},{"id":"D05","theme":"善待自己","text":"把自己照顧好，是你對身邊的人最實際的貢獻。"},{"id":"D06","theme":"善待自己","text":"你的步調，不需要拿別人的時刻表來核對。"},{"id":"D07","theme":"善待自己","text":"做不到的時候，說一聲「我今天不行」，也是勇敢。"},{"id":"D08","theme":"善待自己","text":"你不是麻煩，你只是累了。"},{"id":"D09","theme":"善待自己","text":"身體發出的訊號，比行事曆更值得聽。"},{"id":"D10","theme":"善待自己","text":"對自己誠實一點，日子就輕一點。"},{"id":"D11","theme":"善待自己","text":"你值得一段不被打擾的時間。"},{"id":"D12","theme":"善待自己","text":"不想說話的日子，就安靜地待著。"},{"id":"D13","theme":"善待自己","text":"你可以拒絕，而且不需要附上長長的理由。"},{"id":"D14","theme":"善待自己","text":"哭完喝杯水，你已經做得很好了。"},{"id":"D15","theme":"善待自己","text":"別急著否定今天的自己，他也是第一次過今天。"},{"id":"D16","theme":"善待自己","text":"把對別人的體諒，分一點給自己。"},{"id":"D17","theme":"善待自己","text":"你不需要對每個人都有用。"},{"id":"D18","theme":"善待自己","text":"累的時候，連「加油」都可以先不聽。"},{"id":"D19","theme":"善待自己","text":"你的感受是真的，不需要誰來核准。"},{"id":"D20","theme":"善待自己","text":"今天先照顧好自己，其他的明天再說。"},{"id":"E01","theme":"感恩與重新開始","text":"數一數今天順利的三件小事，心就有地方站。"},{"id":"E02","theme":"感恩與重新開始","text":"平凡無事的一天，其實是很難得的一天。"},{"id":"E03","theme":"感恩與重新開始","text":"還感覺得到風吹在臉上，就代表你正好好活著。"},{"id":"E04","theme":"感恩與重新開始","text":"每一次呼吸，都是一次重新開始的機會。"},{"id":"E05","theme":"感恩與重新開始","text":"今天過得不好，不代表人生過得不好。"},{"id":"E06","theme":"感恩與重新開始","text":"搞砸了也沒關係，明天的太陽不記仇。"},{"id":"E07","theme":"感恩與重新開始","text":"低潮不是終點，是轉彎的地方。"},{"id":"E08","theme":"感恩與重新開始","text":"把今天過好，就是給未來最好的安排。"},{"id":"E09","theme":"感恩與重新開始","text":"謝謝今天的自己，撐到了現在。"},{"id":"E10","theme":"感恩與重新開始","text":"睡前把煩惱放在門外，它們明天還在，但你會更有力氣。"},{"id":"E11","theme":"感恩與重新開始","text":"早上醒來，就是又多了一次機會。"},{"id":"E12","theme":"感恩與重新開始","text":"謝謝那個願意聽你說話的人，也謝謝願意說出口的自己。"},{"id":"E13","theme":"感恩與重新開始","text":"有熱水可以洗澡、有床可以睡，今天其實不算太差。"},{"id":"E14","theme":"感恩與重新開始","text":"把「還沒做到」改成「正在路上」。"},{"id":"E15","theme":"感恩與重新開始","text":"重來沒有次數限制。"},{"id":"E16","theme":"感恩與重新開始","text":"走錯路也有風景，記下來，下次就認得路。"},{"id":"E17","theme":"感恩與重新開始","text":"「現在開始」這四個字，任何時候說都有效。"},{"id":"E18","theme":"感恩與重新開始","text":"小小的進步也算數。"},{"id":"E19","theme":"感恩與重新開始","text":"能平安回到家，就是今天的好消息。"},{"id":"E20","theme":"感恩與重新開始","text":"謝謝今天遇到的一點點好，哪怕只是一陣涼風。"}],"methods":[{"id":"M01","category":"呼吸","name":"4-7-8 呼吸","how":"鼻子吸氣 4 秒 → 閉氣 7 秒 → 嘴巴吐氣 8 秒，重複 4 輪","time":"2 分"},{"id":"M02","category":"呼吸","name":"方塊呼吸","how":"吸 4 秒 → 停 4 秒 → 吐 4 秒 → 停 4 秒，重複 4–6 輪","time":"2 分"},{"id":"M03","category":"呼吸","name":"腹式呼吸","how":"一手放胸、一手放腹；吸氣時只讓腹部的手升起，吐氣比吸氣長","time":"3–5 分"},{"id":"M04","category":"呼吸","name":"兩吸一吐（嘆息式）","how":"鼻子吸滿後再補吸一小口，接著用嘴長長吐氣，做 3–5 次","time":"1 分"},{"id":"M05","category":"呼吸","name":"數息","how":"自然呼吸，每次吐氣默數 1 到 10；數亂了就從 1 重來","time":"5 分"},{"id":"M31","category":"呼吸","name":"左右鼻孔交替呼吸","how":"拇指按住右鼻孔，左鼻吸 4 秒 → 換無名指按住左鼻孔，右鼻吐 4 秒 → 右吸左吐，算一輪；做 5 輪","time":"3 分"},{"id":"M32","category":"呼吸","name":"哼聲吐氣（蜂鳴式）","how":"鼻子吸氣，吐氣時閉嘴發出「嗯——」的長音，感受臉和胸腔的震動，做 6 次","time":"2 分"},{"id":"M33","category":"呼吸","name":"延長吐氣","how":"吸 4 秒、吐 8 秒，不閉氣，重複 10 次","time":"2 分"},{"id":"M06","category":"感官與自然","name":"看天空","how":"抬頭看雲 2 分鐘，只做一件事：找出雲移動的方向","time":"2 分"},{"id":"M07","category":"感官與自然","name":"5-4-3-2-1 感官著陸","how":"依序說出 5 個看到的、4 個摸到的、3 個聽到的、2 個聞到的、1 個嚐到的","time":"2 分"},{"id":"M08","category":"感官與自然","name":"聽聲音","how":"閉眼 1 分鐘，由遠到近數出環境中有幾種不同的聲音","time":"1 分"},{"id":"M09","category":"感官與自然","name":"赤腳踩地","how":"脫鞋站在草地或木地板，感受腳跟、大拇趾根、小趾根三個支點","time":"3 分"},{"id":"M10","category":"感官與自然","name":"凝視一個物件","how":"選一片葉子、一顆石頭或燭火，看 2 分鐘，找出 3 個以前沒注意的細節","time":"2 分"},{"id":"M11","category":"感官與自然","name":"專心喝一杯茶","how":"雙手握杯感受溫度 → 聞香 → 小口含 3 秒再吞；前三口不看手機","time":"3 分"},{"id":"M34","category":"感官與自然","name":"曬太陽","how":"早上到戶外或窗邊，讓光照在臉和手臂上 10 分鐘；不直視太陽","time":"10 分"},{"id":"M35","category":"感官與自然","name":"樹下慢走（森林浴）","how":"找有樹的地方走 15 分鐘，手機收起來，輪流注意顏色、聲音、氣味","time":"15 分"},{"id":"M36","category":"感官與自然","name":"看流動的水","how":"看河、海、噴泉或魚缸 3 分鐘，視線跟著一道水波走","time":"3 分"},{"id":"M37","category":"感官與自然","name":"專心聽一首歌","how":"戴耳機聽一首沒有歌詞的音樂，從頭到尾只跟著其中一種樂器","time":"4 分"},{"id":"M38","category":"感官與自然","name":"照顧一盆植物","how":"澆水、摘枯葉、用手指摸土的濕度；一次只照顧一盆","time":"5 分"},{"id":"M12","category":"身體","name":"漸進式肌肉放鬆","how":"由腳到臉，每個部位用力繃緊 5 秒、放鬆 10 秒","time":"10 分"},{"id":"M13","category":"身體","name":"身體掃描","how":"坐或躺，注意力從頭頂慢慢移到腳底，每個部位停一個呼吸，只觀察不調整","time":"5–10 分"},{"id":"M14","category":"身體","name":"慢走","how":"速度放慢到平常的一半，每一步默念「抬、移、放」","time":"5 分"},{"id":"M15","category":"身體","name":"伸展三式","how":"頸部側彎、肩膀繞圈、站姿前彎，各停留 5 個呼吸","time":"3 分"},{"id":"M16","category":"身體","name":"運動 20 分鐘","how":"快走、慢跑或騎車，強度抓在「微喘但還能說話」","time":"20 分"},{"id":"M17","category":"身體","name":"抖動釋放","how":"站立、膝蓋微彎，全身上下抖動 1 分鐘，再靜止站 30 秒","time":"2 分"},{"id":"M18","category":"身體","name":"蝴蝶擁抱","how":"雙手交叉抱胸，左右手輪流輕拍上臂，配合慢呼吸","time":"1–2 分"},{"id":"M39","category":"身體","name":"自我按壓","how":"雙手搓熱，依序按壓太陽穴、後頸、虎口，每處 30 秒","time":"2 分"},{"id":"M40","category":"身體","name":"嬰兒式","how":"跪坐後上身前趴，額頭貼地或墊枕頭，手臂放身側，停留 10 個呼吸","time":"2 分"},{"id":"M41","category":"身體","name":"抬腿靠牆","how":"躺下，臀部靠近牆面，雙腿靠牆伸直，手放腹部，停留 5 分鐘","time":"5 分"},{"id":"M42","category":"身體","name":"搓熱雙手敷眼","how":"雙手快搓 20 下到發熱，掌心蓋住閉上的眼睛，停 5 個呼吸，做 3 次","time":"1 分"},{"id":"M19","category":"水與溫度","name":"沖澡","how":"熱水沖肩頸 1 分鐘，注意力只放在水打在皮膚上的感覺，想像水把今天的事帶走","time":"5 分"},{"id":"M20","category":"水與溫度","name":"冷水洗臉","how":"冷水潑臉，或冰毛巾敷眼周與臉頰 15–30 秒","time":"1 分"},{"id":"M21","category":"水與溫度","name":"泡腳","how":"約 40°C 溫水過腳踝，泡 15 分鐘，可加一匙鹽","time":"15 分"},{"id":"M43","category":"水與溫度","name":"慢慢洗手","how":"溫水沖手 30 秒，注意水溫與泡沫的觸感，再慢慢擦乾每一根手指","time":"1 分"},{"id":"M44","category":"水與溫度","name":"熱敷肩頸","how":"熱毛巾或暖暖包放在後頸與肩膀 10 分鐘，同時閉眼","time":"10 分"},{"id":"M22","category":"香氣物件與手印","name":"精油嗅吸","how":"薰衣草、佛手柑或乳香，滴 1–2 滴在面紙，距鼻子 10 公分慢吸 5 次","time":"1 分"},{"id":"M23","category":"香氣物件與手印","name":"握水晶定錨","how":"選一顆順手的石頭（白水晶、紫水晶、黑碧璽皆可）握在掌心，感受重量、溫度、稜角，配 10 次呼吸","time":"2 分"},{"id":"M24","category":"香氣物件與手印","name":"智慧手印","how":"拇指與食指指尖輕觸，其餘三指自然伸直，手背放膝上，搭配慢呼吸","time":"3–5 分"},{"id":"M25","category":"香氣物件與手印","name":"禪定手印","how":"雙手掌心向上相疊放在腹前，兩拇指尖輕觸成橢圓，眼睛半閉","time":"5 分"},{"id":"M45","category":"香氣物件與手印","name":"撥手珠","how":"拿一串手珠，每撥一顆配一次吐氣，撥完一圈","time":"3 分"},{"id":"M46","category":"香氣物件與手印","name":"合掌","how":"雙手在胸前合掌，掌根輕輕互推 5 秒再放鬆，重複 5 次，注意掌心的溫度","time":"1 分"},{"id":"M26","category":"心念","name":"感恩三件事","how":"睡前寫下今天 3 件順利的小事，每件加一句「為什麼會發生」","time":"5 分"},{"id":"M27","category":"心念","name":"煩惱清倒","how":"計時 5 分鐘，把腦中所有事不分類寫在紙上；寫完圈出明天只做的 1 件","time":"5 分"},{"id":"M28","category":"心念","name":"情緒命名","how":"對自己說一句「我現在感覺到＿＿」，只命名、不分析","time":"30 秒"},{"id":"M29","category":"心念","name":"慈心祝福","how":"默念「願我平安、願我放鬆」，再把「我」換成一位親人、一位陌生人","time":"3 分"},{"id":"M30","category":"心念","name":"專心做一件家事","how":"洗碗、摺衣服或澆花，全程不聽不看其他東西，注意力放在手的動作","time":"10 分"},{"id":"M47","category":"心念","name":"默念一句話","how":"選一句短句（例如「今天只過今天的份」），吸氣念前半、吐氣念後半，10 次","time":"2 分"},{"id":"M48","category":"心念","name":"固定的擔心時間","how":"白天冒出的煩惱先記在紙上，每天固定 15 分鐘集中想；時間到就停","time":"15 分"},{"id":"M49","category":"心念","name":"離開螢幕 30 分鐘","how":"手機開飛航或放到另一個房間，這段時間只做一件不需要螢幕的事","time":"30 分"},{"id":"M50","category":"心念","name":"隨手塗畫","how":"拿筆在紙上重複畫圈、線條或著色，不求好看，注意筆尖的觸感","time":"5–10 分"},{"id":"M71","category":"聲音與音樂","name":"聽喜歡的音樂","how":"選一首聽了會放鬆的歌，戴耳機從頭聽到尾，這幾分鐘不做別的事","time":"4 分"},{"id":"M72","category":"聲音與音樂","name":"冥想音樂","how":"播放節奏緩慢、沒有歌詞的冥想音樂，閉上眼睛，讓呼吸跟著音樂慢下來","time":"10 分"},{"id":"M73","category":"聲音與音樂","name":"佛曲與梵唄","how":"聽一首佛經歌曲或梵唄，例如〈心經〉、〈大悲咒〉的唱誦版；注意力放在旋律與字音，不必理解每一句","time":"5–10 分"},{"id":"M74","category":"聲音與音樂","name":"跟著唱誦或哼唱","how":"跟著佛號、經文或喜歡的旋律小聲唱或哼，把吐氣放長，感受胸腔的震動","time":"5 分"},{"id":"M75","category":"聲音與音樂","name":"自然聲音","how":"播放雨聲、海浪或溪流聲，音量調低，閉上眼睛只聽聲音","time":"5 分"},{"id":"M51","category":"身體照顧","name":"含 EPA 的藻油（素食 Omega-3）","how":"核對標示上 EPA 與 DHA 各自的毫克數，選 EPA 佔比高的藻油；每日 EPA 約 1 克以內，隨餐吃","time":"","evidence":"中（對象為有憂鬱症狀者）","source":"Liao 2019"},{"id":"M52","category":"身體照顧","name":"益生菌","how":"選標示菌株編號、有人體試驗的產品，連續使用數週後評估","time":"","evidence":"弱到中","source":"Liu 2019"},{"id":"M53","category":"身體照顧","name":"地中海式飲食","how":"多吃蔬果、全穀、豆類、魚、堅果、橄欖油；少吃甜食、油炸與加工肉","time":"","evidence":"中（樣本小）","source":"Jacka 2017"},{"id":"M54","category":"身體照顧","name":"高纖加發酵食物","how":"每天都有高纖蔬果全穀，加一份發酵食物（如無糖優格、泡菜、味噌）","time":"","evidence":"初步","source":"Berding 2023"},{"id":"M55","category":"身體照顧","name":"鎂","how":"先從食物補：深綠色蔬菜、堅果、豆類、全穀；要吃補充劑先問醫師","time":"","evidence":"弱到中","source":"Tarleton 2017"},{"id":"M56","category":"身體照顧","name":"維生素 D","how":"先靠日曬與抽血確認是否不足，再決定是否補充","time":"","evidence":"弱","source":"Mikola 2023"},{"id":"M57","category":"身體照顧","name":"咖啡因截止時間","how":"睡前 6 小時起不喝咖啡、茶、能量飲料","time":"","evidence":"中（樣本小）","source":"Drake 2013"},{"id":"M58","category":"身體照顧","name":"把睡眠顧好","how":"每天固定時間起床（含假日）；床只用來睡覺；躺 20 分鐘睡不著就先離開床","time":"","evidence":"強","source":"Scott 2021"},{"id":"M59","category":"身體照顧","name":"白天亮、晚上暗","how":"白天多到戶外；睡前 1–2 小時調暗燈光，臥室盡量全暗","time":"","evidence":"中（觀察性研究，不能證明因果）","source":"Burns 2023"},{"id":"M60","category":"身體照顧","name":"肌力訓練","how":"每週 2 次、每次 20–30 分鐘：深蹲、伏地挺身、彈力帶等","time":"","evidence":"強","source":"Gordon 2018"},{"id":"M61","category":"利他","name":"定期小額捐款","how":"選一個認同的公益團體，設定每月固定小額捐款；捐完讀一則該團體的成果報告","time":"5 分"},{"id":"M62","category":"利他","name":"請人一杯","how":"幫同事、朋友或家人付一杯飲料或一份點心","time":"1 分"},{"id":"M63","category":"利他","name":"每天一件小善事","how":"幫忙按電梯、讓座、提東西；睡前記下今天做的那一件","time":"1 分"},{"id":"M64","category":"利他","name":"具體的感謝","how":"傳一則訊息給幫過你的人，寫出他做了什麼、對你有什麼影響","time":"5 分"},{"id":"M65","category":"利他","name":"專心聽人說話","how":"10 分鐘不看手機、不打斷、不給建議，只複述對方說的重點","time":"10 分"},{"id":"M66","category":"利他","name":"真心稱讚","how":"每天對一個人說一句具體的稱讚，說出你看到他做了什麼","time":"1 分"},{"id":"M67","category":"利他","name":"捐出用不到的東西","how":"整理 5 件還能用的衣物、書或用品，送到捐贈點","time":"20 分"},{"id":"M68","category":"利他","name":"分享食物","how":"多準備一份水果或點心，分給同事或鄰居","time":"10 分"},{"id":"M69","category":"利他","name":"教人一件事","how":"把一項你會的事教給需要的人，例如手機操作、做菜、整理報表","time":"30 分"},{"id":"M70","category":"利他","name":"志工服務","how":"每月一次到固定單位服務，例如淨灘、陪伴長者、動物收容所","time":"2–3 小時"}],"classics":[{"id":"C01","direction":"回到當下","source":"《道德經》第 64 章","text":"千里之行，始於足下。","plain":"再遠的路，也只從腳下這一步開始。"},{"id":"C03","direction":"回到當下","source":"《道德經》第 44 章","text":"知足不辱，知止不殆，可以長久。","plain":"懂得夠了、懂得停，才走得久。"},{"id":"C04","direction":"回到當下","source":"《道德經》第 8 章","text":"上善若水。水善利萬物而不爭。","plain":"像水一樣，滋養一切卻不爭搶。"},{"id":"C06","direction":"回到當下","source":"《道德經》第 23 章","text":"飄風不終朝，驟雨不終日。","plain":"狂風暴雨都撐不過一天，難關也一樣。"},{"id":"C07","direction":"回到當下","source":"《道德經》第 45 章","text":"躁勝寒，靜勝熱，清靜為天下正。","plain":"心靜下來，事情自然回到正軌。"},{"id":"C08","direction":"回到當下","source":"《道德經》第 63 章","text":"天下難事，必作於易；天下大事，必作於細。","plain":"難事從容易的地方做起，大事從小處做起。"},{"id":"C61","direction":"回到當下","source":"《道德經》第 9 章","text":"持而盈之，不如其已。","plain":"裝到滿出來，不如適時停手。"},{"id":"C62","direction":"回到當下","source":"《道德經》第 15 章","text":"孰能濁以靜之徐清？","plain":"混濁的水，靜下來就會慢慢變清。"},{"id":"C63","direction":"回到當下","source":"《道德經》第 24 章","text":"企者不立，跨者不行。","plain":"踮著腳站不久，跨大步走不遠。"},{"id":"C64","direction":"回到當下","source":"《道德經》第 26 章","text":"重為輕根，靜為躁君。","plain":"穩重是輕浮的根基，安靜管得住躁動。"},{"id":"C65","direction":"回到當下","source":"《道德經》第 46 章","text":"知足之足，常足矣。","plain":"懂得滿足的那種滿足，才是長久的滿足。"},{"id":"C66","direction":"回到當下","source":"《道德經》第 78 章","text":"天下莫柔弱於水，而攻堅強者莫之能勝。","plain":"水最柔軟，卻沒有什麼硬的東西贏得過它。"},{"id":"C09","direction":"回到當下","source":"《莊子·養生主》","text":"安時而處順，哀樂不能入也。","plain":"安於當下、順著變化，情緒就進不來。"},{"id":"C10","direction":"回到當下","source":"《莊子·人間世》","text":"知其不可奈何而安之若命。","plain":"知道無法改變的事，就安然接受它。"},{"id":"C11","direction":"回到當下","source":"《莊子·知北遊》","text":"人生天地之間，若白駒之過隙，忽然而已。","plain":"人生像白馬掠過門縫，一閃就過。"},{"id":"C67","direction":"回到當下","source":"《莊子·逍遙遊》","text":"鷦鷯巢於深林，不過一枝；偃鼠飲河，不過滿腹。","plain":"小鳥築巢只要一根樹枝，真正需要的其實不多。"},{"id":"C70","direction":"回到當下","source":"《淮南子·人間訓》","text":"此何遽不為福乎？","plain":"這件事，怎麼知道不會變成好事呢？"},{"id":"C13","direction":"回到當下","source":"《論語·述而》","text":"君子坦蕩蕩，小人長戚戚。","plain":"心胸放開就自在，計較就一直不安。"},{"id":"C14","direction":"回到當下","source":"《論語·子罕》","text":"逝者如斯夫，不舍晝夜。","plain":"時間像河水，日夜不停地流走。"},{"id":"C15","direction":"回到當下","source":"《論語·子路》","text":"欲速則不達。","plain":"越急，越到不了。"},{"id":"C16","direction":"回到當下","source":"《論語·微子》","text":"往者不可諫，來者猶可追。","plain":"過去的改不了，接下來的還來得及。"},{"id":"C17","direction":"回到當下","source":"《論語·雍也》","text":"知之者不如好之者，好之者不如樂之者。","plain":"懂得不如喜歡，喜歡不如樂在其中。"},{"id":"C18","direction":"回到當下","source":"《論語·憲問》","text":"不怨天，不尤人。","plain":"不埋怨老天，也不責怪別人。"},{"id":"C71","direction":"回到當下","source":"《論語·述而》","text":"飯疏食飲水，曲肱而枕之，樂亦在其中矣。","plain":"粗茶淡飯、枕著手臂睡，快樂也在裡面。"},{"id":"C72","direction":"回到當下","source":"《論語·雍也》","text":"一簞食，一瓢飲，在陋巷，人不堪其憂，回也不改其樂。","plain":"生活再簡單，顏回還是過得很快樂。"},{"id":"C73","direction":"回到當下","source":"《論語·子罕》","text":"知者不惑，仁者不憂，勇者不懼。","plain":"看得明白就不迷惑，心存善意就不憂愁。"},{"id":"C75","direction":"回到當下","source":"《論語·先進》","text":"過猶不及。","plain":"做過頭和做不夠，一樣不好。"},{"id":"C19","direction":"回到當下","source":"《大學》","text":"知止而后有定，定而后能靜，靜而后能安。","plain":"知道停在哪裡，心才定、才靜、才安。"},{"id":"C20","direction":"回到當下","source":"《大學》","text":"心不在焉，視而不見，聽而不聞，食而不知其味。","plain":"心不在場，看了、聽了、吃了都等於沒有。"},{"id":"C21","direction":"回到當下","source":"《中庸》","text":"君子素其位而行，不願乎其外。","plain":"站在現在的位置，做現在該做的事。"},{"id":"C77","direction":"回到當下","source":"《孟子·公孫丑上》","text":"必有事焉而勿正，心勿忘，勿助長也。","plain":"用心去做，但不要硬去揠苗助長。"},{"id":"C23","direction":"回到當下","source":"《荀子·勸學》","text":"不積跬步，無以至千里；不積小流，無以成江海。","plain":"沒有一小步一小步，就到不了遠方。"},{"id":"C24","direction":"回到當下","source":"《金剛經》","text":"過去心不可得，現在心不可得，未來心不可得。","plain":"過去、未來的念頭都抓不住，連當下也無須抓。"},{"id":"C26","direction":"回到當下","source":"《金剛經》","text":"一切有為法，如夢幻泡影，如露亦如電，應作如是觀。","plain":"一切都像夢、像泡沫、像露水，會變、會過。"},{"id":"C27","direction":"回到當下","source":"《心經》","text":"心無罣礙，無罣礙故，無有恐怖。","plain":"心裡沒有牽掛，就沒有害怕。"},{"id":"C85","direction":"回到當下","source":"《四十二章經》","text":"人命在幾間？……呼吸間。","plain":"生命就在一呼一吸之間。"},{"id":"C32","direction":"回到當下","source":"《佛遺教經》","text":"知足之人，雖臥地上，猶為安樂。","plain":"知足的人，睡在地上也覺得安穩。"},{"id":"C83","direction":"回到當下","source":"永嘉玄覺《證道歌》","text":"行亦禪，坐亦禪，語默動靜體安然。","plain":"走也好、坐也好、說話安靜都好，處處可以安住。"},{"id":"C31","direction":"回到當下","source":"《景德傳燈錄》大珠慧海","text":"飢來喫飯，困來即眠。","plain":"餓了就吃、睏了就睡，一次只做一件事。"},{"id":"C86","direction":"回到當下","source":"《五燈會元》趙州從諗","text":"喫茶去。","plain":"別想太多，先去喝杯茶。"},{"id":"C84","direction":"回到當下","source":"布袋和尚〈插秧偈〉","text":"手把青秧插滿田，低頭便見水中天。……退步原來是向前。","plain":"低頭才看見天，退一步其實是往前。"},{"id":"C30","direction":"回到當下","source":"無門慧開《無門關》","text":"春有百花秋有月，夏有涼風冬有雪。若無閑事掛心頭，便是人間好時節。","plain":"心裡沒掛著雜事，每個季節都是好時節。"},{"id":"C33","direction":"回到當下","source":"明·《小窗幽記》（亦見《菜根譚》）","text":"寵辱不驚，閒看庭前花開花落；去留無意，漫隨天外雲卷雲舒。","plain":"得失都不驚慌，像看花開花落、雲卷雲舒。"},{"id":"C34","direction":"回到當下","source":"《菜根譚》","text":"風來疏竹，風過而竹不留聲；雁度寒潭，雁去而潭不留影。","plain":"事情來了就面對，過了就不留在心上。"},{"id":"C35","direction":"回到當下","source":"陶淵明〈飲酒·其五〉","text":"採菊東籬下，悠然見南山。","plain":"低頭採菊，一抬頭，山就在那裡。"},{"id":"C36","direction":"回到當下","source":"陶淵明〈雜詩·其一〉","text":"盛年不重來，一日難再晨。","plain":"好時光不會重來，一天也沒有第二個早晨。"},{"id":"C37","direction":"回到當下","source":"王維〈終南別業〉","text":"行到水窮處，坐看雲起時。","plain":"走到沒路了，就坐下來看雲升起。"},{"id":"C90","direction":"回到當下","source":"王維〈鳥鳴澗〉","text":"人閒桂花落，夜靜春山空。","plain":"人閒下來，才察覺得到桂花落下。"},{"id":"C91","direction":"回到當下","source":"王維〈竹里館〉","text":"獨坐幽篁裡，彈琴復長嘯。","plain":"一個人坐在竹林裡彈琴、長嘯，自在得很。"},{"id":"C38","direction":"回到當下","source":"李白〈獨坐敬亭山〉","text":"相看兩不厭，只有敬亭山。","plain":"靜靜對望而不厭倦的，只有眼前這座山。"},{"id":"C92","direction":"回到當下","source":"李白〈把酒問月〉","text":"今人不見古時月，今月曾經照古人。","plain":"同一個月亮照過古人，此刻也照著你。"},{"id":"C46","direction":"回到當下","source":"白居易〈對酒〉","text":"蝸牛角上爭何事，石火光中寄此身。","plain":"在蝸牛角那麼小的地方爭什麼？人生只是一瞬火光。"},{"id":"C39","direction":"回到當下","source":"蘇軾〈定風波〉","text":"莫聽穿林打葉聲，何妨吟嘯且徐行。","plain":"別管風雨聲多大，照自己的步調慢慢走。"},{"id":"C40","direction":"回到當下","source":"蘇軾〈定風波〉","text":"回首向來蕭瑟處，歸去，也無風雨也無晴。","plain":"回頭看走過的風雨，其實都過去了。"},{"id":"C42","direction":"回到當下","source":"蘇軾〈前赤壁賦〉","text":"惟江上之清風，與山間之明月……取之無禁，用之不竭。","plain":"清風明月不用錢、用不完，隨時可以享受。"},{"id":"C93","direction":"回到當下","source":"蘇軾〈記承天寺夜遊〉","text":"何夜無月？何處無竹柏？但少閑人如吾兩人者耳。","plain":"哪一晚沒有月亮？只是少了有閒心去看的人。"},{"id":"C94","direction":"回到當下","source":"蘇軾〈臨江仙·送錢穆父〉","text":"人生如逆旅，我亦是行人。","plain":"人生像一間旅店，我也只是路過的旅人。"},{"id":"C95","direction":"回到當下","source":"蘇軾〈浣溪沙·細雨斜風作曉寒〉","text":"人間有味是清歡。","plain":"人間最有味道的，是清淡的歡喜。"},{"id":"C43","direction":"回到當下","source":"程顥〈秋日偶成〉","text":"萬物靜觀皆自得，四時佳興與人同。","plain":"靜下來看，萬物都自在，四季都有趣。"},{"id":"C45","direction":"回到當下","source":"陸游〈遊山西村〉","text":"山重水複疑無路，柳暗花明又一村。","plain":"以為沒路了，轉個彎又是一片新風景。"},{"id":"C48","direction":"回到當下","source":"《聖經·馬太福音》6:34（和合本）","text":"不要為明天憂慮，因為明天自有明天的憂慮；一天的難處一天當就夠了。","plain":"今天的難處今天擔就好。"},{"id":"C49","direction":"回到當下","source":"《聖經·傳道書》3:1（和合本）","text":"凡事都有定期，天下萬務都有定時。","plain":"每件事都有它自己的時間。"},{"id":"C100","direction":"回到當下","source":"《聖經·傳道書》11:7（和合本）","text":"光本是佳美的，眼見日光也是可悅的。","plain":"光是美好的，能看見陽光就值得開心。"},{"id":"C50","direction":"回到當下","source":"《聖經·箴言》17:22（和合本）","text":"喜樂的心乃是良藥。","plain":"心情好，本身就是一帖藥。"},{"id":"C60","direction":"回到當下","source":"《聖經·腓立比書》4:6（和合本）","text":"應當一無掛慮。","plain":"把掛慮放下。"},{"id":"C51","direction":"回到當下","source":"馬可·奧理略《沉思錄》卷 3 第 10 節","text":"每個人活著的只有現在這短短一瞬；其餘的不是已經過去，就是還沒到來。（意譯）","plain":"你真正擁有的只有現在。"},{"id":"C52","direction":"回到當下","source":"馬可·奧理略《沉思錄》卷 8 第 36 節","text":"別讓整個人生的想像壓垮你；只問眼前這一件事，有什麼是承受不了的？（意譯）","plain":"不要一次扛一輩子，只處理眼前這件。"},{"id":"C53","direction":"回到當下","source":"塞內卡《道德書簡》第 13 封","text":"我們在想像中受的苦，比在現實裡多。（意譯）","plain":"多數的苦是想出來的。"},{"id":"C97","direction":"回到當下","source":"塞內卡《論生命之短暫》第 1 章","text":"我們擁有的時間並不少，只是浪費的太多。（意譯）","plain":"時間夠用，只要不白白流掉。"},{"id":"C54","direction":"回到當下","source":"愛比克泰德《手冊》第 5 節","text":"困擾人的不是事情本身，而是人對事情的看法。（意譯）","plain":"換個看法，困擾就鬆開。"},{"id":"C98","direction":"回到當下","source":"愛比克泰德《手冊》第 8 節","text":"不要要求事情照你希望的發生；希望它照它發生的樣子發生，日子就順了。（意譯）","plain":"接受事情本來的樣子，就順了。"},{"id":"C55","direction":"回到當下","source":"賀拉斯《頌歌》卷 1 第 11 首","text":"把握今天，盡量少指望明天。（意譯）","plain":"今天能做的、能感受的，就今天。"},{"id":"C56","direction":"回到當下","source":"巴斯卡《思想錄》第 139 則","text":"人的一切不幸都來自一件事：不懂得安靜地待在房間裡。（意譯）","plain":"學會安靜獨處，煩惱少一半。"},{"id":"C99","direction":"回到當下","source":"梭羅《湖濱散記》（1854）","text":"我們的生命被瑣事一點一點耗掉了。簡單，再簡單。（意譯）","plain":"少一點瑣事，多一點生活。"},{"id":"C59","direction":"回到當下","source":"泰戈爾《漂鳥集》第 6 首（1916）","text":"如果你因為錯過太陽而流淚，你也將錯過群星。（意譯）","plain":"一直為失去的難過，會錯過眼前有的。"},{"id":"C02","direction":"回到本我","source":"《道德經》第 33 章","text":"知人者智，自知者明。勝人者有力，自勝者強。","plain":"看懂別人是聰明，看懂自己才是明白。"},{"id":"C05","direction":"回到本我","source":"《道德經》第 16 章","text":"致虛極，守靜篤。","plain":"把心清空到底，把安靜守到最深。"},{"id":"C101","direction":"回到本我","source":"《道德經》第 16 章","text":"夫物芸芸，各復歸其根。歸根曰靜。","plain":"萬物再繁茂，最後都回到自己的根；回到根就安靜了。"},{"id":"C102","direction":"回到本我","source":"《道德經》第 19 章","text":"見素抱樸，少私寡欲。","plain":"回到樸素的樣子，私心和欲望少一點。"},{"id":"C103","direction":"回到本我","source":"《道德經》第 28 章","text":"常德不離，復歸於嬰兒。","plain":"不離開本有的德性，就能回到嬰兒般的純真。"},{"id":"C104","direction":"回到本我","source":"《道德經》第 48 章","text":"為學日益，為道日損。","plain":"求學是每天增加，回到道是每天減少。"},{"id":"C105","direction":"回到本我","source":"《道德經》第 47 章","text":"不出戶，知天下；不窺牖，見天道。","plain":"答案不必往外找，向內就看得見。"},{"id":"C106","direction":"回到本我","source":"《道德經》第 52 章","text":"用其光，復歸其明。","plain":"順著那一點光，回到自己本有的明亮。"},{"id":"C107","direction":"回到本我","source":"《道德經》第 55 章","text":"含德之厚，比於赤子。","plain":"內在厚實的人，像初生的嬰兒一樣。"},{"id":"C108","direction":"回到本我","source":"《道德經》第 25 章","text":"人法地，地法天，天法道，道法自然。","plain":"一層一層往上學，最後是順著本來的樣子。"},{"id":"C12","direction":"回到本我","source":"《莊子·德充符》","text":"人莫鑑於流水，而鑑於止水。","plain":"流動的水照不出人影，心靜了才看得清自己。"},{"id":"C68","direction":"回到本我","source":"《莊子·應帝王》","text":"至人之用心若鏡，不將不迎，應而不藏。","plain":"心像鏡子：不送、不迎，來了就照，過了不留。"},{"id":"C69","direction":"回到本我","source":"《莊子·人間世》","text":"虛室生白，吉祥止止。","plain":"房間空了才透光；心空了，好事才住得下來。"},{"id":"C109","direction":"回到本我","source":"《莊子·齊物論》","text":"天地與我並生，而萬物與我為一。","plain":"我和天地同在，和萬物本是一體。"},{"id":"C110","direction":"回到本我","source":"《莊子·駢拇》","text":"吾所謂明者，非謂其見彼也，自見而已矣。","plain":"真正的看得清，不是看見別人，而是看見自己。"},{"id":"C111","direction":"回到本我","source":"《莊子·繕性》","text":"喪己於物，失性於俗者，謂之倒置之民。","plain":"為了外物弄丟自己、為了世俗弄丟本性，是本末倒置。"},{"id":"C118","direction":"回到本我","source":"《論語·衛靈公》","text":"君子求諸己，小人求諸人。","plain":"君子向自己找答案，小人向別人要。"},{"id":"C119","direction":"回到本我","source":"《論語·顏淵》","text":"為仁由己，而由人乎哉？","plain":"做個好人靠自己，哪裡是靠別人？"},{"id":"C120","direction":"回到本我","source":"《論語·憲問》","text":"古之學者為己，今之學者為人。","plain":"從前的人學習是為了充實自己，現在是為了給人看。"},{"id":"C74","direction":"回到本我","source":"《論語·顏淵》","text":"內省不疚，夫何憂何懼？","plain":"問心無愧，就沒什麼好擔心害怕的。"},{"id":"C121","direction":"回到本我","source":"《大學》","text":"所謂誠其意者，毋自欺也。","plain":"真誠的第一步，是不騙自己。"},{"id":"C78","direction":"回到本我","source":"《中庸》","text":"喜怒哀樂之未發，謂之中；發而皆中節，謂之和。","plain":"情緒還沒起是「中」，起了而恰到好處是「和」。"},{"id":"C117","direction":"回到本我","source":"《中庸》","text":"天命之謂性，率性之謂道。","plain":"天生的叫本性，順著本性走就是道。"},{"id":"C22","direction":"回到本我","source":"《孟子·告子上》","text":"學問之道無他，求其放心而已矣。","plain":"學習沒有別的，就是把跑掉的心找回來。"},{"id":"C76","direction":"回到本我","source":"《孟子·盡心上》","text":"萬物皆備於我矣。反身而誠，樂莫大焉。","plain":"回頭看自己、對自己誠實，就是最大的快樂。"},{"id":"C112","direction":"回到本我","source":"《孟子·盡心上》","text":"盡其心者，知其性也。知其性，則知天矣。","plain":"把心用到底，就認識自己的本性。"},{"id":"C113","direction":"回到本我","source":"《孟子·離婁下》","text":"大人者，不失其赤子之心者也。","plain":"了不起的人，是沒有弄丟童心的人。"},{"id":"C114","direction":"回到本我","source":"《孟子·告子上》","text":"仁義禮智，非由外鑠我也，我固有之也。","plain":"善不是外面加給我的，是我本來就有的。"},{"id":"C115","direction":"回到本我","source":"《孟子·盡心上》","text":"人之所不學而能者，其良能也；所不慮而知者，其良知也。","plain":"不用學就會、不用想就知道的，是人本有的良知良能。"},{"id":"C116","direction":"回到本我","source":"《孟子·離婁上》","text":"行有不得者，皆反求諸己。","plain":"事情不順，先回頭看自己。"},{"id":"C122","direction":"回到本我","source":"王陽明〈詠良知四首示諸生〉","text":"人人自有定盤針，萬化根源總在心。","plain":"每個人心裡都有一根指南針。"},{"id":"C123","direction":"回到本我","source":"王陽明臨終語（《年譜》）","text":"此心光明，亦復何言。","plain":"心是光明的，還需要多說什麼。"},{"id":"C25","direction":"回到本我","source":"《金剛經》","text":"應無所住而生其心。","plain":"心不黏在任何事上，才能活潑地運作。"},{"id":"C79","direction":"回到本我","source":"《金剛經》","text":"凡所有相，皆是虛妄。","plain":"眼前看到的樣子都會變，不必執著到底。"},{"id":"C28","direction":"回到本我","source":"《六祖壇經》","text":"菩提本無樹，明鏡亦非臺。本來無一物，何處惹塵埃。","plain":"心本來就乾淨，煩惱是後來自己加上去的。"},{"id":"C29","direction":"回到本我","source":"《六祖壇經》","text":"不是風動，不是幡動，仁者心動。","plain":"動的不是外面的風和旗，是你的心。"},{"id":"C80","direction":"回到本我","source":"《六祖壇經》","text":"何期自性，本自清淨。","plain":"沒想到自己的本心，原本就是清淨的。"},{"id":"C81","direction":"回到本我","source":"《六祖壇經》","text":"一燈能除千年暗，一智能滅萬年愚。","plain":"一盞燈就能照亮千年的暗，一念清明就夠了。"},{"id":"C124","direction":"回到本我","source":"《六祖壇經》","text":"菩提自性，本來清淨，但用此心，直了成佛。","plain":"覺悟的本性原本清淨，直接用這顆心就好。"},{"id":"C125","direction":"回到本我","source":"《六祖壇經》","text":"不思善，不思惡，正與麼時，那箇是明上座本來面目？","plain":"不想好、不想壞的那一刻，什麼是你本來的樣子？"},{"id":"C126","direction":"回到本我","source":"《六祖壇經》","text":"佛向性中作，莫向身外求。","plain":"佛在自己的本性裡，不要往外找。"},{"id":"C127","direction":"回到本我","source":"《六祖壇經》","text":"不識本心，學法無益。","plain":"不認識自己的心，學再多也沒用。"},{"id":"C128","direction":"回到本我","source":"《六祖壇經》","text":"前念迷即凡夫，後念悟即佛。","plain":"上一念迷糊，下一念醒來就不同了。"},{"id":"C88","direction":"回到本我","source":"《維摩詰經》","text":"直心是道場。","plain":"真誠直接的心，就是修行的地方。"},{"id":"C132","direction":"回到本我","source":"《維摩詰經》","text":"隨其心淨，則佛土淨。","plain":"心乾淨了，所在的世界就乾淨。"},{"id":"C129","direction":"回到本我","source":"《華嚴經》","text":"心如工畫師，能畫諸世間。","plain":"心像畫家，世界是它畫出來的。"},{"id":"C130","direction":"回到本我","source":"《大般涅槃經》","text":"一切眾生悉有佛性。","plain":"每個生命都有覺醒的本質。"},{"id":"C131","direction":"回到本我","source":"《楞嚴經》","text":"狂性自歇，歇即菩提。","plain":"狂亂的心一停下來，當下就是覺悟。"},{"id":"C82","direction":"回到本我","source":"僧璨《信心銘》","text":"至道無難，唯嫌揀擇。","plain":"道理並不難，難在我們老是挑三揀四。"},{"id":"C87","direction":"回到本我","source":"《景德傳燈錄》馬祖道一","text":"平常心是道。","plain":"平常的心，就是道。"},{"id":"C133","direction":"回到本我","source":"《景德傳燈錄》馬祖道一","text":"自家寶藏不顧，拋家散走作什麼？","plain":"自己家裡的寶藏不看，到處亂跑做什麼？"},{"id":"C134","direction":"回到本我","source":"《臨濟錄》","text":"隨處作主，立處皆真。","plain":"到哪裡都做自己的主人，站的地方就是真實。"},{"id":"C135","direction":"回到本我","source":"《五燈會元》茶陵郁禪師","text":"我有明珠一顆，久被塵勞關鎖。今朝塵盡光生，照破山河萬朵。","plain":"我有一顆明珠，被灰塵蓋了很久；灰塵散了，光就照遍山河。"},{"id":"C89","direction":"回到本我","source":"《菜根譚》","text":"醲肥辛甘非真味，真味只是淡；神奇卓異非至人，至人只是常。","plain":"真正的好味道是淡，真正了不起的人是平常。"},{"id":"C136","direction":"回到本我","source":"陶淵明〈歸園田居·其一〉","text":"久在樊籠裡，復得返自然。","plain":"在籠子裡關久了，終於又回到自然。"},{"id":"C137","direction":"回到本我","source":"陶淵明〈歸去來辭〉","text":"既自以心為形役，奚惆悵而獨悲？","plain":"既然是自己讓心被身體使喚，又何必獨自難過？"},{"id":"C41","direction":"回到本我","source":"蘇軾〈定風波·南海歸贈王定國侍人寓娘〉","text":"此心安處是吾鄉。","plain":"心安定的地方，就是家。"},{"id":"C138","direction":"回到本我","source":"蘇軾〈題西林壁〉","text":"不識廬山真面目，只緣身在此山中。","plain":"看不清真相，是因為自己就在裡面。"},{"id":"C139","direction":"回到本我","source":"辛棄疾〈青玉案·元夕〉","text":"眾裡尋他千百度，驀然回首，那人卻在，燈火闌珊處。","plain":"到處找了千百回，一回頭，原來就在那裡。"},{"id":"C44","direction":"回到本我","source":"朱熹〈觀書有感〉","text":"問渠那得清如許？為有源頭活水來。","plain":"水能這麼清，是因為源頭一直有活水。"},{"id":"C47","direction":"回到本我","source":"諸葛亮〈誡子書〉","text":"非淡泊無以明志，非寧靜無以致遠。","plain":"看淡一點才知道要什麼，心靜才走得遠。"},{"id":"C140","direction":"回到本我","source":"德爾菲阿波羅神廟箴言","text":"認識你自己。","plain":"一切從認識自己開始。"},{"id":"C141","direction":"回到本我","source":"柏拉圖《申辯篇》38a","text":"未經省察的人生不值得過。（意譯）","plain":"要回頭看看自己是怎麼活的。"},{"id":"C96","direction":"回到本我","source":"馬可·奧理略《沉思錄》卷 4 第 3 節","text":"人能退隱的地方，沒有一處比自己的內心更安靜。（意譯）","plain":"最安靜的避風港在自己心裡。"},{"id":"C142","direction":"回到本我","source":"馬可·奧理略《沉思錄》卷 7 第 59 節","text":"向內挖掘。善的泉源就在裡面，只要你一直挖，它就會一直湧出。（意譯）","plain":"好東西在裡面，往內找。"},{"id":"C143","direction":"回到本我","source":"馬可·奧理略《沉思錄》卷 12 第 4 節","text":"人人愛自己勝過愛別人，卻把別人的看法看得比自己的還重。（意譯）","plain":"別把別人的眼光看得比自己重。"},{"id":"C144","direction":"回到本我","source":"奧古斯丁《論真宗教》第 39 章","text":"不要往外走，回到你自己裡面；真理住在人的內心。（意譯）","plain":"真理不在外面。"},{"id":"C145","direction":"回到本我","source":"《聖經·路加福音》17:21（和合本）","text":"神的國就在你們心裡。","plain":"最珍貴的不在外頭，在心裡。"},{"id":"C146","direction":"回到本我","source":"《聖經·箴言》4:23（和合本）","text":"你要保守你心，勝過保守一切，因為一生的果效是由心發出。","plain":"顧好自己的心，比顧好任何東西都重要。"},{"id":"C147","direction":"回到本我","source":"莎士比亞《哈姆雷特》第一幕第三場","text":"最要緊的是：對自己忠實。（意譯）","plain":"先不騙自己。"},{"id":"C58","direction":"回到本我","source":"愛默生〈自立〉（1841）","text":"除了你自己，沒有什麼能帶給你平靜。（意譯）","plain":"平靜不在外面，在自己身上。"},{"id":"C148","direction":"回到本我","source":"愛默生〈自立〉（1841）","text":"相信你自己：每一顆心都隨著這根鐵弦震動。（意譯）","plain":"相信自己內在的聲音。"},{"id":"C57","direction":"回到本我","source":"梭羅《湖濱散記》（1854）","text":"我走進森林，是因為想從容地生活，只面對生命最基本的事實。（意譯）","plain":"把生活減到最簡單，才看得到重點。"},{"id":"C149","direction":"回到本我","source":"梭羅《湖濱散記》結語（1854）","text":"一個人若跟不上同伴的步伐，也許是因為他聽見了不同的鼓聲。（意譯）","plain":"跟著自己聽見的節奏走。"},{"id":"C150","direction":"回到本我","source":"《歌者奧義書》6.8.7","text":"那就是你。（意譯）","plain":"你尋找的那個本質，就是你自己。"}]}'))).quotes,f=(t(c)).methods,p=(t(c)).classics;function m(e,t){let n=(0,u.useRef)(new Map(e.map(e=>[e.id,e]))),r=(0,u.useRef)(null),l=(0,u.useRef)(null);return(0,u.useCallback)(()=>{if(null===r.current){try{let e=JSON.parse(localStorage.getItem(t)??"null");e&&Array.isArray(e.bag)&&(r.current=e.bag.filter(e=>n.current.has(e)),l.current="string"==typeof e.last?e.last:null)}catch{}r.current??=[]}if(0===r.current.length){let t=e.map(e=>e.id);for(let e=t.length-1;e>0;e--){let n=Math.floor(Math.random()*(e+1));[t[e],t[n]]=[t[n],t[e]]}t.length>1&&t[t.length-1]===l.current&&([t[0],t[t.length-1]]=[t[t.length-1],t[0]]),r.current=t}let a=r.current.pop();l.current=a;try{localStorage.setItem(t,JSON.stringify({bag:r.current,last:a}))}catch{}return n.current.
